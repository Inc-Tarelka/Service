name: Deploy Landing to Backend Servers

on:
  workflow_dispatch:

  push:
    branches:
      - backend
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"

jobs:
  validate-manual-branch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'backend' && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Unsupported branch for manual deploy
        run: |
          echo "Manual landing deploy is allowed only from 'backend' (test) or 'main' (prod)."
          echo "Selected branch: '${{ github.ref_name }}'"
          exit 1

  deploy-test-landing:
    if: ${{ github.ref_name == 'backend' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy landing to test server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "landing/**"
          target: "/root"

      - name: Deploy landing on test server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/landing

            cat > .env.landing <<'EOF'
            LANDING_HOST=tarelka-api.ru
            LANDING_HOST_WWW=www.tarelka-api.ru
            EOF

            docker network create tarelka-network || true
            docker compose --env-file .env.landing -f docker-compose.yml build
            docker compose --env-file .env.landing -f docker-compose.yml up -d --remove-orphans

  deploy-prod-landing:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy landing to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 193.187.94.235
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "landing/**"
          target: "/root"

      - name: Deploy landing on production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 193.187.94.235
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/landing

            cat > .env.landing <<'EOF'
            LANDING_HOST=tarelka-kino.ru
            LANDING_HOST_WWW=www.tarelka-kino.ru
            EOF

            docker network create tarelka-network || true
            docker compose --env-file .env.landing -f docker-compose.yml build
            docker compose --env-file .env.landing -f docker-compose.yml up -d --remove-orphans

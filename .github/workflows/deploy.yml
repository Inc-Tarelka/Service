name: Deploy API to Server

on:
  workflow_dispatch:
  # При желании можно раскомментировать, чтобы деплой запускался на push в main,
  # и только при изменениях внутри api/
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'api/**'
  #     - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup existing .env on server (if any)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /root/api || true
            cd /root/api || true
            if [ -f .env ]; then
              cp .env .env.bak
            fi

      # Важно: копируем только подпапку api на сервер, при этом target=/root,
      # чтобы в итоге файлы попали в /root/api (без лишней вложенности).
      - name: Copy API project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "api/**"
          target: "/root"

      - name: Deploy and restart docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/api
            # Восстановить .env, если бэкапнули
            if [ -f .env.bak ]; then
              mv .env.bak .env
            fi
            # Права на ACME хранилище (если есть)
            if [ -f ./letsencrypt/acme.json ]; then
              chmod 600 ./letsencrypt/acme.json || true
            fi
            docker compose pull || true
            docker compose build
            docker compose up -d --remove-orphans
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=${PORT:-8080}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN}
      - TELEGRAM_GATEWAY_URL=${TELEGRAM_GATEWAY_URL}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - TELEGRAM_PROXY_SECRET=${TELEGRAM_PROXY_SECRET:-}
      - TELEGRAM_MINIAPP_SECRET=${TELEGRAM_MINIAPP_SECRET:-}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-168h}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://tarelka-kino.ru,https://www.tarelka-kino.ru}
      - ALLOWED_ORIGIN_SUFFIXES=${ALLOWED_ORIGIN_SUFFIXES:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - CDN_BASE_URL=${CDN_BASE_URL:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tarelka-network"
      - "traefik.http.routers.api.rule=Host(`${API_HOST}`,`${API_HOST_WWW}`) && (PathPrefix(`/api`) || PathPrefix(`/swagger`) || Path(`/health`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.routers.api-web.rule=Host(`${API_HOST}`,`${API_HOST_WWW}`) && (PathPrefix(`/api`) || PathPrefix(`/swagger`) || Path(`/health`))"
      - "traefik.http.routers.api-web.entrypoints=web"
      - "traefik.http.routers.api-web.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    restart: unless-stopped
    networks:
      - tarelka-network

  traefik:
    image: traefik:v2.11
    command:
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=tarelka-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - tarelka-network
    restart: unless-stopped

networks:
  tarelka-network:
    external: true
    name: tarelka-network

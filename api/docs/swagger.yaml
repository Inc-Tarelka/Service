basePath: /api/v1
definitions:
  model.AccountData:
    properties:
      companyName:
        description: Для COMPANY
        type: string
      name:
        description: Для PERSON
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      surname:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/model.AccountType'
        enum:
        - PERSON
        - COMPANY
      username:
        type: string
    required:
    - password
    - phone
    - type
    - username
    type: object
  model.AccountType:
    enum:
    - PERSON
    - COMPANY
    type: string
    x-enum-varnames:
    - AccountTypePerson
    - AccountTypeCompany
  model.AddCommentRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  model.AttachPublicationImageItem:
    properties:
      key:
        type: string
      position:
        type: integer
    required:
    - key
    type: object
  model.AttachPublicationImagesRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/model.AttachPublicationImageItem'
        type: array
    required:
    - items
    type: object
  model.AttachPublicationImagesResponse:
    properties:
      images:
        items:
          $ref: '#/definitions/model.PublicationImage'
        type: array
    type: object
  model.City:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.Comment:
    properties:
      authorId:
        type: integer
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
    type: object
  model.ConfirmLogoUploadRequest:
    properties:
      key:
        type: string
      mimeType:
        type: string
      size:
        type: integer
    required:
    - key
    type: object
  model.ConfirmLogoUploadResponse:
    properties:
      logoUrl:
        type: string
    type: object
  model.ConfirmWallpaperUploadResponse:
    properties:
      wallpaperUrl:
        type: string
    type: object
  model.CreateOrUpdatePublicationRequest:
    properties:
      cityId:
        type: integer
      coAuthorIds:
        items:
          type: integer
        type: array
      description:
        type: string
      imageUrls:
        items:
          type: string
        type: array
      name:
        type: string
      needs:
        items:
          $ref: '#/definitions/model.NeedUpsertItem'
        type: array
      tagIds:
        items:
          type: integer
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.PublicationType'
        enum:
        - PROJECT
        - SERVICE
    required:
    - name
    - type
    type: object
  model.Direction:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  model.FileUploadSpec:
    properties:
      contentType:
        type: string
    required:
    - contentType
    type: object
  model.FindWork:
    enum:
    - LOOKING
    - NOT_LOOKING
    - OPEN_TO_OFFERS
    type: string
    x-enum-varnames:
    - FindWorkLooking
    - FindWorkNotLooking
    - FindWorkOpenToOffer
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      userId:
        type: integer
    type: object
  model.Need:
    properties:
      budget:
        type: integer
      cityId:
        type: integer
      deadlineEnd:
        type: string
      deadlineStart:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      publicationId:
        type: integer
      tags:
        items:
          $ref: '#/definitions/model.NeedTag'
        type: array
    type: object
  model.NeedSearchItem:
    properties:
      cityName:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      publicationDescription:
        type: string
      publicationName:
        type: string
    type: object
  model.NeedTag:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.NeedUpsertItem:
    properties:
      budget:
        type: integer
      cityId:
        type: integer
      deadlineEnd:
        type: string
      deadlineStart:
        description: ISO-8601
        type: string
      description:
        type: string
      id:
        description: if provided, update; otherwise create
        type: integer
      name:
        type: string
      tagIds:
        items:
          type: integer
        type: array
    required:
    - name
    type: object
  model.PasswordForgotRequest:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  model.PasswordForgotResponse:
    properties:
      requestId:
        type: string
    type: object
  model.PasswordResetRequest:
    properties:
      newPassword:
        minLength: 6
        type: string
      username:
        type: string
      verificationCode:
        type: string
      verificationRequestId:
        type: string
    required:
    - newPassword
    - username
    - verificationCode
    - verificationRequestId
    type: object
  model.PasswordResetResponse:
    properties:
      success:
        type: boolean
    type: object
  model.PhoneVerification:
    properties:
      verificationCode:
        type: string
      verificationRequestId:
        type: string
    type: object
  model.PreRegisterRequest:
    properties:
      account:
        $ref: '#/definitions/model.AccountData'
      initData:
        type: string
    required:
    - account
    - initData
    type: object
  model.PreRegisterResponse:
    properties:
      userId:
        type: integer
    type: object
  model.PresignPublicationImagesRequest:
    properties:
      files:
        items:
          $ref: '#/definitions/model.FileUploadSpec'
        type: array
    required:
    - files
    type: object
  model.PresignPublicationImagesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/model.PresignUploadItem'
        type: array
    type: object
  model.PresignUploadItem:
    properties:
      headers:
        additionalProperties:
          type: string
        type: object
      key:
        type: string
      publicUrl:
        type: string
      uploadUrl:
        type: string
    type: object
  model.PresignUploadRequest:
    properties:
      contentType:
        type: string
    required:
    - contentType
    type: object
  model.PresignUploadResponse:
    properties:
      headers:
        additionalProperties:
          type: string
        type: object
      key:
        type: string
      uploadUrl:
        type: string
    type: object
  model.Publication:
    properties:
      authorId:
        type: integer
      authorTelegramUrl:
        description: AuthorTelegramURL — ссылка на Telegram автора, если задано
        type: string
      cityId:
        type: integer
      coAuthors:
        items:
          $ref: '#/definitions/model.TarelkaUser'
        type: array
      commentsCount:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      images:
        items:
          $ref: '#/definitions/model.PublicationImage'
        type: array
      likesCount:
        type: integer
      name:
        type: string
      needs:
        items:
          $ref: '#/definitions/model.Need'
        type: array
      tags:
        items:
          $ref: '#/definitions/model.PublicationTag'
        type: array
      topImageUrl:
        description: TopImageURL — URL изображения с приоритетом 1, если задано
        type: string
      type:
        $ref: '#/definitions/model.PublicationType'
    type: object
  model.PublicationImage:
    properties:
      id:
        type: integer
      position:
        type: integer
      url:
        type: string
    type: object
  model.PublicationTag:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.PublicationType:
    enum:
    - PROJECT
    - SERVICE
    type: string
    x-enum-varnames:
    - PublicationTypeProject
    - PublicationTypeService
  model.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  model.RefreshResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  model.RegisterRequest:
    properties:
      account:
        $ref: '#/definitions/model.AccountData'
      cityIds:
        items:
          type: integer
        type: array
      directionIds:
        items:
          type: integer
        type: array
      initData:
        type: string
      phoneVerification:
        $ref: '#/definitions/model.PhoneVerification'
      specializationIds:
        items:
          type: integer
        type: array
    required:
    - account
    - initData
    type: object
  model.RegisterResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      userId:
        type: integer
    type: object
  model.SendPhoneVerificationRequest:
    properties:
      phoneNumber:
        type: string
    required:
    - phoneNumber
    type: object
  model.SendPhoneVerificationResponse:
    properties:
      requestId:
        type: string
    type: object
  model.SetLogoURLRequest:
    properties:
      logoUrl:
        type: string
    required:
    - logoUrl
    type: object
  model.SetWallpaperURLRequest:
    properties:
      wallpaperUrl:
        type: string
    required:
    - wallpaperUrl
    type: object
  model.Specialization:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  model.SuccessResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  model.TarelkaCompany:
    properties:
      company_name:
        type: string
      tarelka_user_id:
        type: integer
    type: object
  model.TarelkaPerson:
    properties:
      name:
        type: string
      surname:
        type: string
      tarelka_user_id:
        type: integer
    type: object
  model.TarelkaUser:
    properties:
      bio:
        description: Short bio / about me
        type: string
      conversation:
        type: integer
      conversation_updated_at:
        description: ConversationUpdatedAt — when conversation stage was last changed
        type: string
      created_at:
        type: string
      education:
        description: Education — free text
        type: string
      find_work:
        allOf:
        - $ref: '#/definitions/model.FindWork'
        description: FindWork — enum indicating whether user is looking for a job
      id:
        type: integer
      logo_url:
        type: string
      phone:
        type: string
      telegram_url:
        type: string
      tg_user_id:
        type: integer
      type:
        $ref: '#/definitions/model.AccountType'
      username:
        type: string
      wallpaper_url:
        description: Wallpaper (cover image) URL — stored in S3 similarly to LogoURL
        type: string
    type: object
  model.TarelkaUserFull:
    properties:
      bio:
        description: Short bio / about me
        type: string
      cities:
        items:
          $ref: '#/definitions/model.City'
        type: array
      company:
        $ref: '#/definitions/model.TarelkaCompany'
      conversation:
        type: integer
      conversation_updated_at:
        description: ConversationUpdatedAt — when conversation stage was last changed
        type: string
      created_at:
        type: string
      directions:
        items:
          $ref: '#/definitions/model.Direction'
        type: array
      education:
        description: Education — free text
        type: string
      find_work:
        allOf:
        - $ref: '#/definitions/model.FindWork'
        description: FindWork — enum indicating whether user is looking for a job
      id:
        type: integer
      logo_url:
        type: string
      person:
        $ref: '#/definitions/model.TarelkaPerson'
      phone:
        type: string
      specializations:
        items:
          $ref: '#/definitions/model.Specialization'
        type: array
      telegram_url:
        type: string
      tg_user_id:
        type: integer
      type:
        $ref: '#/definitions/model.AccountType'
      username:
        type: string
      wallpaper_url:
        description: Wallpaper (cover image) URL — stored in S3 similarly to LogoURL
        type: string
    type: object
  model.UpdateUserRequest:
    properties:
      bio:
        type: string
      education:
        type: string
      find_work:
        description: Use the same enum values as model.FindWork (string values)
        type: string
    type: object
  model.VerifyCodeRequest:
    properties:
      verificationCode:
        type: string
      verificationRequestId:
        type: string
    required:
    - verificationCode
    - verificationRequestId
    type: object
  model.VerifyCodeResponse:
    properties:
      phone:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API для Telegram Mini App Tarelka
  title: Tarelka API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Авторизация по username и паролю
      parameters:
      - description: Данные авторизации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Авторизация
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Отзыв refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Выход
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: По username отправляет код на привязанный номер телефона, возвращает
        requestId
      parameters:
      - description: Данные для отправки кода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.PasswordForgotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PasswordForgotResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Запрос на восстановление пароля (отправка кода)
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Принимает username, requestId, code и новый пароль; если проверка
        проходит — меняет пароль
      parameters:
      - description: Данные для смены пароля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PasswordResetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Смена пароля по коду
      tags:
      - auth
  /auth/phone/send:
    post:
      consumes:
      - application/json
      description: Принимает номер телефона и отправляет запрос на Telegram Gateway,
        возвращает requestId
      parameters:
      - description: Данные для отправки кода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SendPhoneVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SendPhoneVerificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Отправка кода верификации телефона
      tags:
      - auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Передаём requestId и code, получаем статус проверки
      parameters:
      - description: Данные проверки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.VerifyCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Проверка кода телефона (ранний шаг)
      tags:
      - auth
  /auth/pre-register:
    post:
      consumes:
      - application/json
      description: Создаёт черновой аккаунт (stage 0) по initData и данным аккаунта
        без проверки кода телефона и без выдачи токенов
      parameters:
      - description: Данные предварительной регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.PreRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.PreRegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Предварительная регистрация через Telegram
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновление access token с помощью refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Обновление токенов
      tags:
      - auth
  /auth/telegram/register:
    post:
      consumes:
      - application/json
      description: Регистрация нового пользователя Tarelka через Telegram Mini App
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Регистрация через Telegram
      tags:
      - auth
  /publications:
    post:
      parameters:
      - description: Данные публикации
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.CreateOrUpdatePublicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать публикацию
      tags:
      - publications
  /publications/{id}:
    put:
      parameters:
      - description: ID публикации
        in: path
        name: id
        required: true
        type: integer
      - description: Данные публикации
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.CreateOrUpdatePublicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить публикацию
      tags:
      - publications
  /publications/{id}/comments:
    post:
      parameters:
      - description: ID публикации
        in: path
        name: id
        required: true
        type: integer
      - description: Комментарий
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.AddCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Comment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Добавить комментарий к публикации
      tags:
      - publications
  /publications/{id}/images:
    post:
      parameters:
      - description: ID публикации
        in: path
        name: id
        required: true
        type: integer
      - description: Список ключей и позиций
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/model.AttachPublicationImagesRequest'
      produces:
      - application/json
      responses:

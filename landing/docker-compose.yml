services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tarelka-network"
      - "traefik.http.routers.landing.rule=Host(`${LANDING_HOST}`,`${LANDING_HOST_WWW}`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.priority=1"
      - "traefik.http.routers.landing.tls=true"
      - "traefik.http.routers.landing.tls.certresolver=myresolver"
      - "traefik.http.services.landing.loadbalancer.server.port=80"
      - "traefik.http.routers.landing-web.rule=Host(`${LANDING_HOST}`,`${LANDING_HOST_WWW}`)"
      - "traefik.http.routers.landing-web.entrypoints=web"
      - "traefik.http.routers.landing-web.middlewares=landing-redirect-to-https"
      - "traefik.http.middlewares.landing-redirect-to-https.redirectscheme.scheme=https"
    restart: unless-stopped
    networks:
      - tarelka-network

networks:
  tarelka-network:
    external: true
    name: tarelka-network
